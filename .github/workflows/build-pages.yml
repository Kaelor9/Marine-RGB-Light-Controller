name: Build and publish Prism installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ARDUINO_CORE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FQBN: esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@v6

      - name: Installer Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Installer ESP32-platform og biblioteker
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls "$ARDUINO_CORE_URL"

          arduino-cli core install esp32:esp32 \
            --additional-urls "$ARDUINO_CORE_URL"

          arduino-cli lib install "FastLED"
          arduino-cli lib install "WiFiManager"

      - name: Kompilér firmware
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir build \
            --export-binaries \
            Marine_RGB_Controller.ino

      - name: Klargør samlet firmwarefil
        shell: bash
        run: |
          set -euo pipefail

          MERGED_FILE="$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n 1)"

          if [ -z "$MERGED_FILE" ]; then
            echo "Kunne ikke finde en merged firmwarefil."
            echo "Filer i build-mappen:"
            find build -maxdepth 2 -type f -print
            exit 1
          fi

          cp "$MERGED_FILE" site/firmware.bin

          echo "Firmware:"
          ls -lh site/firmware.bin

      - name: Konfigurér GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload installer-side
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Udgiv installer-link
        id: deployment
        uses: actions/deploy-pages@v5.0.0
